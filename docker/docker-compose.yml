services:
  postgres:
    image: postgres:16-alpine
    container_name: agrimarket-postgres
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-agrimarket}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-your_password_here}
      # The init script will create the keycloak db and user
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres-init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agrimarket"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - agrimarket-net

  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: agrimarket-keycloak
    restart: always
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak}
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
    command: ["start-dev", "--import-realm"]
    volumes:
      - ./keycloak:/opt/keycloak/data/import
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - agrimarket-net

  web:
    build:
      context: ../apps/web
      dockerfile: Dockerfile
    container_name: agrimarket-web
    restart: always
    env_file: .env.local
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started
    networks:
      - agrimarket-net

  # NOTE: n8n is an optional, external workflow automation service.
  # n8n uses the Sustainable Use License (source-available, not OSI-approved).
  # DX-AgriMarket does not import, link, or bundle n8n source code.
  # It communicates with n8n only via HTTP API. n8n can be replaced with any
  # workflow engine without affecting the core application.
  n8n:
    image: n8nio/n8n:latest  # License: Sustainable Use License (fair-code)
    container_name: agrimarket-n8n
    restart: always
    environment:
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=agrimarket
      - DB_POSTGRESDB_USER=${POSTGRES_USER:-agrimarket}
      - DB_POSTGRESDB_PASSWORD=${POSTGRES_PASSWORD:-your_password_here}
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY:-your_n8n_encryption_key_here}
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
      - WTO_API_KEY=${WTO_API_KEY}
      - COMTRADE_API_KEY=${COMTRADE_API_KEY}
      - OLLAMA_MODEL=${OLLAMA_MODEL}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - MATTERMOST_WEBHOOK_URL=${MATTERMOST_WEBHOOK_URL}
    volumes:
      - n8n_data:/home/node/.n8n
    ports:
      - "5678:5678"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - agrimarket-net


  piper:
    image: rhasspy/wyoming-piper:latest
    container_name: agrimarket-piper
    restart: always
    volumes:
      - ../piper-voices:/data
    command: ["--voice", "vi_VN-vais1000-medium"]
    ports:
      - "5500:10200"
    networks:
      - agrimarket-net

  # NOTE: MinIO is an S3-compatible object storage (AGPL-3.0, OSI-approved).
  # DX-AgriMarket communicates with MinIO only via S3 HTTP protocol (pre-signed URLs).
  # No MinIO source code is imported or bundled.
  minio:
    image: minio/minio:latest  # License: AGPL-3.0
    container_name: agrimarket-minio
    restart: always
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-your_minio_access_key}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-your_minio_secret_key}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    networks:
      - agrimarket-net

  disease-api:
    build:
      context: ../apps/disease-api
      dockerfile: Dockerfile
    container_name: agrimarket-disease-api
    restart: always
    # AD-8: NO external port mapping — only Next.js proxy calls this service
    expose:
      - "8000"
    volumes:
      - ../ai-models:/models:ro
    environment:
      - MODEL_DIR=/models
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - agrimarket-net

  mattermost:
    image: mattermost/mattermost-team-edition:latest
    container_name: agrimarket-mattermost
    restart: always

    environment:
      - MM_SQLSETTINGS_DRIVERNAME=postgres
      - MM_SQLSETTINGS_DATASOURCE=postgres://${POSTGRES_USER:-agrimarket}:${POSTGRES_PASSWORD:-your_password_here}@postgres:5432/mattermost?sslmode=disable
      - MM_SERVICESETTINGS_SITEURL=http://localhost:8065
      - MM_SERVICESETTINGS_ENABLEINCOMINGWEBHOOKS=true
    volumes:
      - mattermost_data:/mattermost/data
      - mattermost_config:/mattermost/config
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - agrimarket-net

volumes:
  pgdata:
  n8n_data:
  minio_data:
  mattermost_data:
  mattermost_config:

networks:
  agrimarket-net:
    driver: bridge
