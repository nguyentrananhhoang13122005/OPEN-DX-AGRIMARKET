name: CI Quality Gate

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # ─── Stage 1: Fast checks (lint) ────────────────────────────────────
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        working-directory: apps/web
        run: npm install --no-audit --no-fund

      - name: Generate Prisma Client
        working-directory: apps/web
        run: npx prisma generate

      - name: ESLint
        working-directory: apps/web
        run: npm run lint

      - name: TypeScript Compile Check
        working-directory: apps/web
        run: npx tsc --noEmit

  lint-backend:
    name: Lint FastAPI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: apps/disease-api/requirements.txt

      - name: Install dependencies
        working-directory: apps/disease-api
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Syntax Check
        working-directory: apps/disease-api
        run: python -m py_compile app/main.py

  lint-n8n:
    name: Lint n8n Workflows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate JSON format
        run: |
          for file in workflows/*.json; do
            jq . "$file" > /dev/null || (echo "❌ Invalid JSON in $file" && exit 1)
          done
          echo "✅ All workflows are valid JSON"

  # ─── Stage 2: Tests (depends on lint) ───────────────────────────────
  test-unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        working-directory: apps/web
        run: npm install --no-audit --no-fund

      - name: Generate Prisma Client
        working-directory: apps/web
        run: npx prisma generate

      - name: Run Jest
        working-directory: apps/web
        run: npm test -- --ci --passWithNoTests --coverage
        env:
          AUTH_SECRET: "ci-dummy-secret-key-for-test-only"

  # ─── Stage 3: Build (depends on lint) ───────────────────────────────
  build:
    name: Production Build
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        working-directory: apps/web
        run: npm install --no-audit --no-fund

      - name: Generate Prisma Client
        working-directory: apps/web
        run: npx prisma generate

      - name: Build Standalone
        working-directory: apps/web
        env:
          AUTH_SECRET: "ci-dummy-secret-key-for-build-only"
        run: npm run build

  # ─── Stage 4: Infrastructure validation ─────────────────────────────
  validate-infrastructure:
    name: Validate Scripts & Structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Env and Structure
        run: |
          bash scripts/validate-env.sh
          bash scripts/validate-structure.sh

  # ─── Stage 5: Docker smoke test (depends on infra + build) ──────────
  smoke-test-docker:
    name: Docker Compose Smoke Test
    runs-on: ubuntu-latest
    needs: [validate-infrastructure, build, lint-backend]
    steps:
      - uses: actions/checkout@v4

      - name: Prepare Environments
        run: |
          cp .env.example .env.local
          cp docker/.env.local.example docker/.env.local

      - name: Start Services
        run: docker compose -f docker/docker-compose.yml up -d --build

      - name: Run Smoke Test
        run: |
          sleep 15
          bash scripts/smoke-test.sh

      - name: Docker Logs on Failure
        if: failure()
        run: docker compose -f docker/docker-compose.yml logs
